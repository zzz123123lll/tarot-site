<div class="tool-container" id="toolRoot"></div>
<script type="module">
import { mountTool } from '/shared/toolkit.js?v=2';
function slugFromPath() {
  var p = (location.pathname || '').replace(/^\/+|\/+$/g, '');
  if (p.indexOf('tools/') === 0) p = p.slice(6);
  return p;
}
var __dbg = slugFromPath(); document.getElementById('toolRoot').innerHTML = '<p style=font-size:12px;color:#c00>DEBUG path=[' + location.pathname + '] href=[' + location.href + '] slug=[' + __dbg + ']</p>';
</script>
