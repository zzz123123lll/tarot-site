<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片压缩 · 工具盒</title>
<link rel="stylesheet" href="/tool.css?v=1">
<style>
/* 工具专属样式（苹果浅色） */
.format-tabs { display:flex; gap:8px; margin-bottom:20px; }
.fmt-tab { padding:7px 14px; border-radius:980px; font-size:13px; color:#6e6e73; background:#f5f5f7; cursor:pointer; transition:all .15s; }
.fmt-tab.active { background:#0071e3; color:#fff; }
.settings { display:flex; gap:24px; align-items:center; margin:0 0 20px; flex-wrap:wrap; }
.setting { display:flex; align-items:center; gap:10px; }
.setting label { font-size:13px; color:#6e6e73; white-space:nowrap; }
.setting input[type=range] { width:140px; accent-color:#0071e3; }
.setting .val { font-size:13px; color:#1d1d1f; min-width:44px; }
.progress-bar { display:none; height:6px; background:#f5f5f7; border-radius:999px; margin:16px 0 0; overflow:hidden; }
.progress-bar .fill { height:100%; background:#0071e3; border-radius:999px; transition:width .2s; }
.batch-actions { display:none; gap:10px; margin:16px 0 0; }
.results { margin-top:20px; }
.result-card { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:14px; padding:12px 16px; margin-bottom:10px; transition:border-color .15s; }
.result-card:hover { border-color:rgba(0,0,0,0.16); }
.result-card .preview { width:48px; height:48px; border-radius:8px; object-fit:cover; background:#f5f5f7; cursor:pointer; }
.result-card .info { flex:1; min-width:0; }
.result-card .name { font-size:13px; color:#1d1d1f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.result-card .sizes { font-size:12px; color:#6e6e73; margin-top:2px; }
.result-card .sizes .old { text-decoration:line-through; }
.result-card .sizes .saved { color:#1d9e4e; font-weight:600; }
.comp-badge { font-size:11px; padding:2px 7px; border-radius:999px; margin-left:8px; }
.comp-badge.good { color:#1d9e4e; background:rgba(29,158,78,0.1); }
.comp-badge.meh { color:#b25000; background:rgba(178,80,0,0.1); }
.comp-badge.bad { color:#d70015; background:rgba(215,0,21,0.1); }
.remove-btn { background:none; border:none; color:#86868b; cursor:pointer; font-size:16px; padding:4px 8px; border-radius:6px; }
.remove-btn:hover { color:#d70015; background:rgba(215,0,21,0.08); }
.download-btn { background:#0071e3; color:#fff; border:none; border-radius:980px; padding:8px 14px; font-size:12px; cursor:pointer; }
.download-btn:hover { background:#0077ed; }
.summary { margin-top:20px; background:#f5f5f7; border-radius:14px; padding:16px 18px; }
.summary .total { font-size:14px; color:#1d1d1f; }
.summary .note { font-size:12px; color:#6e6e73; margin-top:4px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; z-index:100; }
.modal.show { display:flex; }
.modal img { max-width:90%; max-height:90%; border-radius:12px; }
.modal .close { position:absolute; top:20px; right:24px; color:#fff; font-size:32px; cursor:pointer; }
.tool-drop .icon svg { width:40px; height:40px; color:#0071e3; }
</style>
</head>
<body>
  <nav class="tool-nav">
    <a href="/">&#8592; 工具盒</a>
    <span class="tool-nav-title">图片压缩</span>
  </nav>

  <div class="tool-container">
    <h1 class="tool-h1">图片压缩</h1>
    <p class="tool-sub">纯浏览器本地压缩，不上传、不联网、不限数量</p>

    <div class="format-tabs">
      <div class="fmt-tab active" data-fmt="auto">自动</div>
      <div class="fmt-tab" data-fmt="image/jpeg">JPEG</div>
      <div class="fmt-tab" data-fmt="image/png">PNG</div>
      <div class="fmt-tab" data-fmt="image/webp">WebP</div>
    </div>

    <div class="settings">
      <div class="setting"><label>质量</label><input type="range" id="quality" min="10" max="100" value="75"><span class="val" id="qualVal">75%</span></div>
      <div class="setting"><label>最大宽度</label><input type="range" id="maxW" min="200" max="4000" value="1920" step="100"><span class="val" id="maxWVal">1920px</span></div>
    </div>

    <div class="tool-drop" id="dropZone">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M3 17l5-5 3.5 3.5L16 11l5 5"/></svg></div>
      <div class="title">点击选择图片，或拖拽到此处</div>
      <div class="hint">支持 JPG、PNG、WebP、BMP、GIF</div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
    <div class="progress-bar" id="progress"><div class="fill" style="width:0%"></div></div>

    <div class="batch-actions" id="batchActions">
      <button class="tool-btn" onclick="downloadAll()">全部下载</button>
      <button class="tool-btn tool-btn--ghost" onclick="recompress()">重新压缩</button>
      <button class="tool-btn tool-btn--ghost" onclick="clearAll()">清除</button>
    </div>

    <div class="results" id="results"></div>
    <div class="summary" id="summary" style="display:none"></div>
  </div>

  <div class="modal" id="modal" onclick="this.classList.remove('show')">
    <span class="close">&times;</span>
    <img id="modalImg" src="" alt="">
  </div>

  <script>

const STORAGE_KEY = 'img-compress-settings';
let targetFormat = 'auto';
let processedFiles = [];
let totalOrig = 0, totalComp = 0;

// Load saved settings
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s) {
      if (s.quality) document.getElementById('quality').value = s.quality;
      if (s.maxW) document.getElementById('maxW').value = s.maxW;
      if (s.fmt) { targetFormat = s.fmt; updateFmtTabs(); }
    }
  } catch(e) {}
  document.getElementById('qualVal').textContent = document.getElementById('quality').value + '%';
  document.getElementById('maxWVal').textContent = document.getElementById('maxW').value + 'px';
}
function saveSettings() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    quality: document.getElementById('quality').value,
    maxW: document.getElementById('maxW').value,
    fmt: targetFormat
  }));
}

document.getElementById('quality').addEventListener('input', () => {
  document.getElementById('qualVal').textContent = document.getElementById('quality').value + '%';
  saveSettings();
});
document.getElementById('maxW').addEventListener('input', () => {
  document.getElementById('maxWVal').textContent = document.getElementById('maxW').value + 'px';
  saveSettings();
});

document.querySelectorAll('.fmt-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    targetFormat = tab.dataset.fmt;
    updateFmtTabs();
    saveSettings();
  });
});

function updateFmtTabs() {
  document.querySelectorAll('.fmt-tab').forEach(t => t.classList.toggle('active', t.dataset.fmt === targetFormat));
}

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('click', () => document.getElementById('fileInput').click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('active'); });
dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('active'); });
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('active');
  handleFiles(e.dataTransfer.files);
});
document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));

async function handleFiles(files) {
  const quality = document.getElementById('quality').value / 100;
  const maxW = parseInt(document.getElementById('maxW').value);
  const progress = document.getElementById('progress');
  progress.style.display = 'block';
  let done = 0;

  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const origSize = file.size;
    totalOrig += origSize;

    const img = await createImageBitmap(file);
    let w = img.width, h = img.height;
    if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    img.close();

    let mime = file.type;
    if (targetFormat !== 'auto') mime = targetFormat;
    if (mime === 'image/bmp' || mime === 'image/gif') mime = 'image/png';

    const blob = await new Promise(r => canvas.toBlob(r, mime, quality));
    const compSize = blob.size;
    totalComp += compSize;
    const url = URL.createObjectURL(blob);
    processedFiles.push({
      name: file.name, origSize, compSize, url, blob,
      saved: origSize > 0 ? ((1 - compSize / origSize) * 100).toFixed(0) : 0
    });

    done++;
    progress.querySelector('.fill').style.width = (done / files.length * 100) + '%';
  }
  progress.style.display = 'none';
  progress.querySelector('.fill').style.width = '0%';
  renderResults();
}

function renderResults() {
  const div = document.getElementById('results');
  div.innerHTML = processedFiles.map((f, i) => {
    const badge = f.saved > 30 ? '<span class="comp-badge good">-' + f.saved + '%</span>'
      : f.saved > 10 ? '<span class="comp-badge meh">-' + f.saved + '%</span>'
      : '<span class="comp-badge bad">-' + f.saved + '%</span>';
    return `<div class="result-card">
      <img class="preview" src="${f.url}" alt="" onclick="previewImage('${f.url}')">
      <div class="info">
        <div class="name">${f.name}${badge}</div>
        <div class="sizes"><span class="old">${formatSize(f.origSize)}</span> → <span class="saved">${formatSize(f.compSize)}</span></div>
      </div>
      <button class="remove-btn" onclick="removeOne(${i})" title="移除">&times;</button>
      <button class="download-btn" onclick="downloadOne(${i})">下载</button>
    </div>`;
  }).join('');
  div.style.display = 'block';
  document.getElementById('batchActions').style.display = processedFiles.length > 0 ? 'flex' : 'none';

  const summary = document.getElementById('summary');
  if (processedFiles.length > 0) {
    const saved = totalOrig > 0 ? ((1 - totalComp / totalOrig) * 100).toFixed(0) : 0;
    summary.style.display = 'block';
    summary.innerHTML = `<div class="total">总计节省 <strong>${formatSize(totalOrig - totalComp)}</strong>（-${saved}%）</div>
      <div class="note">${formatSize(totalOrig)} → ${formatSize(totalComp)} · 处理 ${processedFiles.length} 张 · 全程本地运算</div>`;
  }
}

function removeOne(i) {
  const f = processedFiles[i];
  totalOrig -= f.origSize;
  totalComp -= f.compSize;
  URL.revokeObjectURL(f.url);
  processedFiles.splice(i, 1);
  if (processedFiles.length === 0) clearAll();
  else renderResults();
}

function recompress() {
  const origLength = processedFiles.length;
  processedFiles.forEach(f => URL.revokeObjectURL(f.url));
  processedFiles = [];
  totalOrig = 0;
  totalComp = 0;
  document.getElementById('results').style.display = 'none';
  document.getElementById('fileInput').click();
}

function downloadOne(i) {
  const f = processedFiles[i];
  const a = document.createElement('a');
  a.href = f.url;
  a.download = f.name.replace(/(\.[^.]+)$/, '_compressed$1');
  a.click();
}

function downloadAll() {
  processedFiles.forEach((f, i) => setTimeout(() => downloadOne(i), i * 200));
}

function clearAll() {
  processedFiles.forEach(f => URL.revokeObjectURL(f.url));
  processedFiles = [];
  totalOrig = totalComp = 0;
  document.getElementById('results').style.display = 'none';
  document.getElementById('batchActions').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
}

function previewImage(url) {
  document.getElementById('modalImg').src = url;
  document.getElementById('modal').classList.add('show');
}

function formatSize(bytes) {
  if (bytes >= 1e6) return (bytes/1e6).toFixed(1)+' MB';
  if (bytes >= 1e3) return (bytes/1e3).toFixed(0)+' KB';
  return bytes + ' B';
}

loadSettings();
</script>
</body>
</html>
